<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
      --input-bg: #0f172a;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    label {
      display: block;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .selection-panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background-color: var(--border);
      color: var(--text-secondary);
      width: fit-content;
    }

    .status-badge.active {
      background-color: rgba(99, 102, 241, 0.2);
      color: var(--primary);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .flex-row > * {
      margin-bottom: 0;
    }

    .stage-selector {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      margin-bottom: 12px;
    }

    .stage-option {
      flex: 1;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .stage-option.active {
      background: var(--primary);
      color: white;
    }

    .console {
      height: 180px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      overflow-y: auto;
    }

    .log-line {
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .log-info { color: var(--text-secondary); }
    .log-success { color: var(--success); }
    .log-warning { color: var(--warning); }

    .keys-list-container {
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      border-radius: 8px;
      margin-top: 4px;
    }

    .key-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .key-item:last-child {
      border-bottom: none;
    }

    .key-item:hover {
      background-color: var(--border);
    }

    .key-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
      margin-right: 8px;
    }

    .key-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .key-status.bound {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .key-status.unbound {
      background-color: rgba(148, 163, 184, 0.1);
      color: var(--text-secondary);
    }

    /* Alert Banner */
    .alert-banner {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      color: white;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.15);
      display: none; /* Hidden by default */
    }
  </style>
</head>
<body>

  <h2>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
    CopyFlow GitHub Sync
  </h2>

  <!-- Alert Banner -->
  <div id="update-alert-banner" class="alert-banner">
    <div style="font-weight: 600; margin-bottom: 2px;">🆕 New copy version on GitHub!</div>
    <div id="alert-commit-msg" style="font-size: 11px; font-style: italic; opacity: 0.95; margin-bottom: 4px;">"Commit Message"</div>
    <div id="alert-commit-meta" style="font-size: 10px; opacity: 0.8; margin-bottom: 8px;">By Author (10 mins ago)</div>
    <button id="btn-sync-now" class="btn" style="background: white; color: #b45309; font-weight: 600; padding: 6px 12px; font-size: 11px; width: auto; display: inline-flex;">Sync Now</button>
  </div>

  <!-- Selection / Binding Card -->
  <div class="card">
    <label>Current Selection</label>
    <div id="selection-state" class="selection-panel">
      <div class="log-info">Select a single text layer in Figma to bind a copy key.</div>
    </div>
    
    <div id="binding-form" style="display: none; margin-top: 10px;">
      <div class="flex-row">
        <input type="text" id="bind-key-input" placeholder="e.g. landing.hero.title" style="margin-bottom: 0; flex: 1;">
        <button id="btn-bind" class="btn" style="width: auto; padding-left: 12px; padding-right: 12px;">Bind</button>
        <button id="btn-unbind" class="btn btn-secondary" style="width: auto; padding-left: 12px; padding-right: 12px; display: none;">Unbind</button>
      </div>
    </div>
  </div>

  <!-- Key Explorer Card -->
  <div class="card" style="padding-bottom: 8px;">
    <label>Copy Key Explorer</label>
    <input type="text" id="search-input" placeholder="🔍 Search copy keys..." style="margin-bottom: 0;">
    <div id="keys-list" class="keys-list-container">
      <div class="log-line log-info" style="padding: 12px; text-align: center;">Loading keys...</div>
    </div>
  </div>

  <!-- GitHub Settings Card -->
  <div class="card">
    <label>GitHub Repository</label>
    <input type="text" id="gh-repo" value="" placeholder="e.g. owner/repo">

    <label>CSV File Path</label>
    <input type="text" id="gh-path" value="copy.csv" placeholder="e.g. data/copy.csv">

    <div class="flex-row">
      <div style="flex: 2;">
        <label>Branch</label>
        <input type="text" id="gh-branch" value="main" placeholder="e.g. main" style="margin-bottom: 0;">
      </div>
      <div style="flex: 1.2;">
        <label>&nbsp;</label>
        <button id="btn-refresh" class="btn btn-secondary" style="height: 38px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Check GitHub
        </button>
      </div>
    </div>

    <label style="margin-top: 10px;">GitHub Access Token (Optional)</label>
    <input type="password" id="gh-token" value="" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    
    <label>Target Staging Environment</label>
    <div class="stage-selector">
      <div class="stage-option active" data-stage="draft">Draft</div>
      <div class="stage-option" data-stage="approved">Approved</div>
    </div>

    <button id="btn-sync" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      Sync to Figma
    </button>
  </div>

  <!-- Realtime Console Log -->
  <label>Activity Log</label>
  <div class="console" id="console">
    <div class="log-line log-info">CopyFlow loaded. Waiting for commands...</div>
  </div>

  <script>
    let activeStage = 'draft';
    let selectedNodeId = null;
    let availableKeys = []; // Array of string keys parsed from GitHub CSV
    let boundKeysList = []; // Array of string keys bound in Figma
    
    let documentSha = "";     // Last synced SHA stored in Figma document metadata
    let latestCommitSha = "";  // Newest SHA fetched from GitHub

    // Load configurations safely from localStorage
    try {
      if (localStorage.getItem('copyflow-gh-repo')) {
        document.getElementById('gh-repo').value = localStorage.getItem('copyflow-gh-repo');
      }
      if (localStorage.getItem('copyflow-gh-path')) {
        document.getElementById('gh-path').value = localStorage.getItem('copyflow-gh-path');
      }
      if (localStorage.getItem('copyflow-gh-branch')) {
        document.getElementById('gh-branch').value = localStorage.getItem('copyflow-gh-branch');
      }
      if (localStorage.getItem('copyflow-gh-token')) {
        document.getElementById('gh-token').value = localStorage.getItem('copyflow-gh-token');
      }
    } catch (e) {
      console.warn("localStorage is blocked in this sandbox:", e.message);
    }

    // Tab Switcher
    const options = document.querySelectorAll('.stage-option');
    options.forEach(opt => {
      opt.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        activeStage = opt.dataset.stage;
        log(`Switched view target to "${activeStage.toUpperCase()}"`, 'info');
      });
    });

    // Auto-fetch/check when Repo or Path inputs change
    document.getElementById('gh-repo').addEventListener('change', () => fetchLatestCommit());
    document.getElementById('gh-path').addEventListener('change', () => fetchLatestCommit());
    document.getElementById('gh-branch').addEventListener('change', () => fetchLatestCommit());

    // Manual Refresh button
    document.getElementById('btn-refresh').addEventListener('click', () => {
      fetchLatestCommit(true);
    });

    // Search Filtering
    document.getElementById('search-input').addEventListener('input', () => {
      renderKeysExplorer();
    });

    // Sync Now banner action
    document.getElementById('btn-sync-now').addEventListener('click', () => {
      performSync();
    });

    // Logging helper
    function log(message, level = 'info') {
      const consoleEl = document.getElementById('console');
      const line = document.createElement('div');
      line.className = `log-line log-${level}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // Render Key Explorer List
    function renderKeysExplorer() {
      const container = document.getElementById('keys-list');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      
      if (availableKeys.length === 0) {
        container.innerHTML = `<div style="padding: 12px; text-align: center; color: var(--text-secondary);">No keys available. Connect to GitHub.</div>`;
        return;
      }

      const filtered = availableKeys.filter(k => k.toLowerCase().includes(query));
      
      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 12px; text-align: center; color: var(--text-secondary);">No matching keys found.</div>`;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(key => {
        const item = document.createElement('div');
        item.className = 'key-item';
        
        const isBound = boundKeysList.includes(key);
        
        item.innerHTML = `
          <div class="key-name" title="${escapeHtml(key)}">${escapeHtml(key)}</div>
          <span class="key-status ${isBound ? 'bound' : 'unbound'}">${isBound ? 'Bound' : 'Unbound'}</span>
        `;
        
        // Click to bind key to selected element
        item.addEventListener('click', () => {
          if (selectedNodeId) {
            parent.postMessage({ pluginMessage: { type: 'bind-key', key } }, '*');
          } else {
            log(`Cannot bind "${key}". Please select a single text layer in Figma first.`, 'warning');
          }
        });
        
        container.appendChild(item);
      });
    }

    // Robust RFC 4180 CSV parser
    function parseCsv(csvText) {
      const result = {};
      const rows = [];
      let currentField = '';
      let inQuotes = false;
      let currentRow = [];

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (inQuotes) {
          if (char === '"') {
            if (nextChar === '"') {
              currentField += '"';
              i++; // skip next quote
            } else {
              inQuotes = false;
            }
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' || char === '\n') {
            currentRow.push(currentField.trim());
            currentField = '';
            if (currentRow.length > 0 && currentRow.some(f => f !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
            if (char === '\r' && nextChar === '\n') {
              i++;
            }
          } else {
            currentField += char;
          }
        }
      }
      
      if (currentField || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      if (rows.length <= 1) return result;
      
      const headers = rows[0].map(h => h.toLowerCase().trim());
      const keyIdx = headers.indexOf('key');
      const draftIdx = headers.indexOf('draft');
      const approvedIdx = headers.indexOf('approved');
      const limitIdx = headers.indexOf('character limit');

      if (keyIdx === -1) {
        log("CSV is missing a 'Key' column header.", "warning");
        return result;
      }

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const key = row[keyIdx];
        if (!key) continue;

        const draft = draftIdx !== -1 && row[draftIdx] ? row[draftIdx] : "";
        const approved = approvedIdx !== -1 && row[approvedIdx] ? row[approvedIdx] : "";
        const limit = limitIdx !== -1 && row[limitIdx] ? row[limitIdx] : "";

        result[key] = {
          draft,
          approved,
          characterLimit: limit
        };
      }
      return result;
    }

    // Fetch latest commit metadata for version checking
    async function fetchLatestCommit(isManual = false) {
      const repo = document.getElementById('gh-repo').value.trim();
      const filePath = document.getElementById('gh-path').value.trim();
      const branch = document.getElementById('gh-branch').value.trim() || 'main';
      const token = document.getElementById('gh-token').value.trim();

      if (!repo || !filePath) {
        if (isManual) log("Please enter GitHub Repository (owner/repo) and CSV File Path.", "warning");
        return;
      }

      // Save credentials locally
      try {
        localStorage.setItem('copyflow-gh-repo', repo);
        localStorage.setItem('copyflow-gh-path', filePath);
        localStorage.setItem('copyflow-gh-branch', branch);
        localStorage.setItem('copyflow-gh-token', token);
      } catch (e) {}

      const url = `https://api.github.com/repos/${repo}/commits?path=${encodeURIComponent(filePath)}&sha=${encodeURIComponent(branch)}&per_page=1`;
      const headers = {
        'Accept': 'application/vnd.github.v3+json'
      };
      if (token) {
        headers['Authorization'] = `token ${token}`;
      }

      if (isManual) log("Checking GitHub for updates...", "info");

      try {
        const res = await fetch(url, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const commits = await res.json();
        if (commits.length === 0) {
          log(`No commits found for file "${filePath}" on branch "${branch}".`, 'warning');
          return;
        }

        const latestCommit = commits[0];
        latestCommitSha = latestCommit.sha;
        const commitMsg = latestCommit.commit.message;
        const author = latestCommit.commit.author.name;
        const commitDate = new Date(latestCommit.commit.author.date).toLocaleString();

        // Download CSV file to parse keys
        const copyData = await downloadCopyFile(repo, filePath, branch, token);
        availableKeys = Object.keys(copyData);
        renderKeysExplorer();

        // Compare commit SHA with currently synced doc SHA
        const banner = document.getElementById('update-alert-banner');
        if (latestCommitSha !== documentSha) {
          document.getElementById('alert-commit-msg').textContent = `"${commitMsg}"`;
          document.getElementById('alert-commit-meta').textContent = `By ${author} on ${commitDate}`;
          banner.style.display = 'block';
          if (isManual) log(`New copy version found: ${latestCommitSha.substring(0, 7)}`, 'info');
        } else {
          banner.style.display = 'none';
          if (isManual) log(`Figma is already up-to-date with latest commit: ${latestCommitSha.substring(0, 7)}`, 'success');
        }
      } catch (err) {
        log(`GitHub Check Failed: ${err.message}`, 'warning');
      }
    }

    // Helper to download raw CSV from GitHub (supports public & private repos)
    async function downloadCopyFile(repo, filePath, branch, token) {
      let url;
      const headers = {};

      if (token) {
        // Private repo raw Contents API fetch
        url = `https://api.github.com/repos/${repo}/contents/${filePath}?ref=${branch}`;
        headers['Authorization'] = `token ${token}`;
        headers['Accept'] = 'application/vnd.github.v3.raw';
      } else {
        // Public raw content fetch
        url = `https://raw.githubusercontent.com/${repo}/${branch}/${filePath}?_t=${Date.now()}`;
      }

      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error(`Failed to download file: HTTP ${res.status}`);
      const csvText = await res.text();
      return parseCsv(csvText);
    }

    // Trigger standard sync flow
    async function performSync() {
      const repo = document.getElementById('gh-repo').value.trim();
      const filePath = document.getElementById('gh-path').value.trim();
      const branch = document.getElementById('gh-branch').value.trim() || 'main';
      const token = document.getElementById('gh-token').value.trim();

      log("Downloading latest copy from GitHub...", "info");
      try {
        const copyData = await downloadCopyFile(repo, filePath, branch, token);
        log("Copy downloaded. Syncing layers...", "success");

        parent.postMessage({
          pluginMessage: {
            type: 'sync-layers',
            copyData,
            stage: activeStage,
            sha: latestCommitSha
          }
        }, '*');
      } catch (err) {
        log(`Sync failed: ${err.message}`, "warning");
      }
    }

    // Sync button trigger
    document.getElementById('btn-sync').addEventListener('click', () => {
      performSync();
    });

    // Message handler from Figma main thread
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'selection-changed') {
        const selectionState = document.getElementById('selection-state');
        const bindingForm = document.getElementById('binding-form');
        const bindKeyInput = document.getElementById('bind-key-input');
        const unbindBtn = document.getElementById('btn-unbind');

        boundKeysList = msg.boundKeys || [];
        documentSha = msg.lastSyncedSha || "";
        
        renderKeysExplorer();

        // Refresh banner display based on new documentSha
        const banner = document.getElementById('update-alert-banner');
        if (latestCommitSha && latestCommitSha !== documentSha) {
          banner.style.display = 'block';
        } else {
          banner.style.display = 'none';
        }

        if (msg.selected) {
          selectedNodeId = msg.nodeId;
          selectionState.innerHTML = `
            <div style="font-weight: 600; margin-bottom: 2px;">${escapeHtml(msg.nodeName)}</div>
            <div style="font-size: 11px; color: var(--text-secondary);">Current text: "${escapeHtml(msg.currentText.substring(0, 40))}${msg.currentText.length > 40 ? '...' : ''}"</div>
            ${msg.key ? `<div class="status-badge active" style="margin-top: 6px;">Key: ${escapeHtml(msg.key)}</div>` : '<div class="status-badge" style="margin-top: 6px;">Unbound</div>'}
          `;
          bindingForm.style.display = 'block';
          bindKeyInput.value = msg.key || '';
          
          if (msg.key) {
            unbindBtn.style.display = 'block';
          } else {
            unbindBtn.style.display = 'none';
          }
        } else {
          selectedNodeId = null;
          selectionState.innerHTML = `<div class="log-info">Select a single text layer in Figma to bind a copy key.</div>`;
          bindingForm.style.display = 'none';
          unbindBtn.style.display = 'none';
        }
      }

      if (msg.type === 'log') {
        log(msg.message, msg.level);
      }

      if (msg.type === 'sync-complete') {
        log(`Sync finished. Updated ${msg.updatedCount} layers. Warnings: ${msg.overflowCount}`, 'success');
        fetchLatestCommit();
      }
    };

    // Bind action (Manual Input fallback)
    document.getElementById('btn-bind').addEventListener('click', () => {
      const key = document.getElementById('bind-key-input').value.trim();
      if (!key) return;
      parent.postMessage({ pluginMessage: { type: 'bind-key', key } }, '*');
    });

    // Unbind action
    document.getElementById('btn-unbind').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'unbind-key' } }, '*');
    });

    // Helper to escape html characters safely
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
