<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
      --input-bg: #0f172a;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    label {
      display: block;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      background-color: var(--border);
      color: var(--text-secondary);
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-secondary.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    #settings-panel {
      border-top: 3px solid var(--primary);
    }

    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .flex-row > * {
      margin-bottom: 0;
    }

    .console {
      height: 240px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      overflow-y: auto;
    }

    .log-line {
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .log-info { color: var(--text-secondary); }
    .log-success { color: var(--success); }
    .log-warning { color: var(--warning); }

    .keys-list-container {
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      border-radius: 8px;
      margin-top: 4px;
    }

    .key-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .key-item:last-child {
      border-bottom: none;
    }

    .key-item:hover {
      background-color: var(--border);
    }

    .key-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
      margin-right: 8px;
    }

    .key-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }

    .key-status.bound {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .key-status.unbound {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    /* Alert Banner */
    .alert-banner {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      color: white;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.15);
      display: none; /* Hidden by default */
    }
  </style>
</head>
<body>

  <!-- Top Header with Settings Button -->
  <div class="header-bar">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      CopyFlow
    </h2>
    <button id="btn-settings-toggle" class="btn-secondary" style="border: none; padding: 4px; display: flex;" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Collapsible Settings Panel -->
  <div id="settings-panel" class="card" style="display: none; padding-top: 10px; margin-bottom: 12px;">
    <label>Sync Provider</label>
    <select id="sync-provider" style="margin-bottom: 12px;">
      <option value="github">GitHub Sync</option>
      <option value="google-sheets">Google Sheets Sync</option>
    </select>

    <div id="github-settings-group">
      <label>GitHub Repository</label>
      <input type="text" id="gh-repo" value="coleorloff/copyflow" placeholder="e.g. owner/repo">

      <label>CSV File Path</label>
      <input type="text" id="gh-path" value="CopyFlow/data/copy.csv" placeholder="e.g. data/copy.csv">

      <label>Branch</label>
      <input type="text" id="gh-branch" value="main" placeholder="e.g. main">

      <label>GitHub Access Token</label>
      <input type="password" id="gh-token" value="" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <div id="google-sheets-settings-group" style="display: none;">
      <label>Web App URL</label>
      <input type="text" id="gas-url" value="https://script.google.com/a/macros/google.com/s/AKfycbysI7sy4-hhK3kp-WbNbar7B8K7BjT_jP3GWxfTe6Y_vsT_UySWLL-7hiyeW4notEat/exec" placeholder="https://script.google.com/macros/s/.../exec">

      <label>Secret Access Token</label>
      <input type="password" id="gas-token" value="CopyFlowSecret2026" placeholder="Enter secret token">
    </div>

    <button id="btn-refresh" class="btn btn-secondary" style="height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; font-weight: 600; border-color: var(--primary); color: var(--primary); margin-top: 8px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      Connect & Fetch Latest
    </button>
  </div>

  <!-- Actions Card (At the very top) -->
  <div class="card" style="padding: 12px; margin-bottom: 12px;">
    <div style="display: flex; gap: 8px; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; font-weight: 500; color: var(--text-secondary); width: 80px;">Version:</span>
        <select id="version-select" style="margin-bottom: 0; height: 32px; padding: 4px 8px; flex: 1;">
          <option value="">No versions loaded</option>
        </select>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 4px;">
        <button id="btn-sync" class="btn" style="flex: 1; height: 32px; padding: 0; font-size: 12px; gap: 4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Sync All Layers
        </button>
        <button id="btn-sync-selected" class="btn btn-secondary" style="flex: 1.1; height: 32px; padding: 0; font-size: 12px; gap: 4px; border-color: var(--border);" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Sync Selected Only
        </button>
      </div>
    </div>
  </div>

  <!-- Update Alert Banner -->
  <div id="update-alert-banner" class="alert-banner">
    <div id="alert-banner-title" style="font-weight: 600; margin-bottom: 2px;">🆕 New copy version!</div>
    <div id="alert-commit-msg" style="font-size: 11px; font-style: italic; opacity: 0.95; margin-bottom: 4px;">"Commit Message"</div>
    <div id="alert-commit-meta" style="font-size: 10px; opacity: 0.8; margin-bottom: 8px;">By Author (10 mins ago)</div>
    <button id="btn-sync-now" class="btn" style="background: white; color: #b45309; font-weight: 600; padding: 6px 12px; font-size: 11px; width: auto; display: inline-flex;">Sync Now</button>
  </div>

  <!-- Key Explorer Card -->
  <div class="card" style="padding-bottom: 8px; margin-bottom: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <label style="margin-bottom: 0;">Copy Key Explorer</label>
      <button id="btn-keys-toggle" class="btn-secondary" style="border: none; padding: 2px 6px; font-size: 11px; border-radius: 4px;">Hide</button>
    </div>
    
    <div id="explorer-body">
      <!-- Checked count & Deselect All Header Actions -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span id="checked-count" style="font-size: 11px; color: var(--text-secondary);">0 keys selected</span>
        <button id="btn-deselect-all" class="btn-secondary" style="border: none; padding: 2px 6px; font-size: 11px; border-radius: 4px; display: none; color: var(--primary);">Deselect All</button>
      </div>

      <!-- Selected Layer Status Line -->
      <div id="selection-status-bar" style="background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; display: none; font-size: 11px; align-items: center; gap: 6px;">
        <span style="color: var(--text-secondary);">Selected Canvas Text:</span>
        <strong id="selected-layer-name" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px;">None</strong>
        <span id="selected-layer-match-badge" class="key-status unbound" style="padding: 1px 5px; font-size: 9px;">Unmatched</span>
      </div>

      <input type="text" id="search-input" placeholder="🔍 Search copy keys..." style="margin-bottom: 0;">
      <div id="keys-list" class="keys-list-container">
        <div class="log-line log-info" style="padding: 12px; text-align: center;">Loading keys...</div>
      </div>
    </div>
  </div>

  <!-- Realtime Console Log Card -->
  <div class="card" style="padding-bottom: 14px; margin-bottom: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <label style="margin-bottom: 0;">Activity Log</label>
      <button id="btn-console-toggle" class="btn-secondary" style="border: none; padding: 2px 6px; font-size: 11px; border-radius: 4px;">Hide</button>
    </div>
    <div class="console" id="console">
      <div class="log-line log-info">CopyFlow loaded. Waiting for commands...</div>
    </div>
  </div>

  <script>
    let selectedKeys = new Set(); // Checked copy keys inside the plugin list
    let availableKeys = []; // Array of string keys parsed from GitHub CSV or Google Sheets
    let boundKeysMap = {};  // Map of text layer name -> characters from Figma
    
    let selectedNodeName = ""; // Name of selected Figma text box
    let selectedNodeId = null;  // ID of selected Figma text box

    let documentSha = "";     // Last synced SHA stored in Figma document metadata
    let latestCommitSha = "";  // Newest SHA fetched from GitHub or Hash from Google Sheets
    let cachedCopyData = {};   // Cached parsed copy data

    // Load configurations safely from localStorage
    try {
      const provider = localStorage.getItem('copyflow-sync-provider') || 'google-sheets';
      document.getElementById('sync-provider').value = provider;
      updateProviderSettingsVisibility(provider);

      if (localStorage.getItem('copyflow-gh-repo')) {
        document.getElementById('gh-repo').value = localStorage.getItem('copyflow-gh-repo');
      }
      if (localStorage.getItem('copyflow-gh-path')) {
        document.getElementById('gh-path').value = localStorage.getItem('copyflow-gh-path');
      }
      if (localStorage.getItem('copyflow-gh-branch')) {
        document.getElementById('gh-branch').value = localStorage.getItem('copyflow-gh-branch');
      }
      if (localStorage.getItem('copyflow-gh-token')) {
        document.getElementById('gh-token').value = localStorage.getItem('copyflow-gh-token');
      }
      if (localStorage.getItem('copyflow-gas-url')) {
        document.getElementById('gas-url').value = localStorage.getItem('copyflow-gas-url');
      } else {
        document.getElementById('gas-url').value = "https://script.google.com/a/macros/google.com/s/AKfycbysI7sy4-hhK3kp-WbNbar7B8K7BjT_jP3GWxfTe6Y_vsT_UySWLL-7hiyeW4notEat/exec";
      }
      if (localStorage.getItem('copyflow-gas-token')) {
        document.getElementById('gas-token').value = localStorage.getItem('copyflow-gas-token');
      } else {
        document.getElementById('gas-token').value = "CopyFlowSecret2026";
      }
    } catch (e) {
      console.warn("localStorage is blocked in this sandbox:", e.message);
    }

    function updateProviderSettingsVisibility(provider) {
      const ghGroup = document.getElementById('github-settings-group');
      const gasGroup = document.getElementById('google-sheets-settings-group');
      if (provider === 'github') {
        ghGroup.style.display = 'block';
        gasGroup.style.display = 'none';
      } else {
        ghGroup.style.display = 'none';
        gasGroup.style.display = 'block';
      }
    }

    // Toggle settings panel
    document.getElementById('btn-settings-toggle').addEventListener('click', () => {
      const panel = document.getElementById('settings-panel');
      const btn = document.getElementById('btn-settings-toggle');
      const isVisible = panel.style.display === 'block';
      panel.style.display = isVisible ? 'none' : 'block';
      btn.classList.toggle('active', !isVisible);
    });

    // Toggle explorer panel
    document.getElementById('btn-keys-toggle').addEventListener('click', () => {
      const body = document.getElementById('explorer-body');
      const btn = document.getElementById('btn-keys-toggle');
      const isHidden = getComputedStyle(body).display === 'none';
      body.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? 'Hide' : 'Show';
    });

    // Toggle console panel
    document.getElementById('btn-console-toggle').addEventListener('click', () => {
      const logBox = document.getElementById('console');
      const btn = document.getElementById('btn-console-toggle');
      const isHidden = getComputedStyle(logBox).display === 'none';
      logBox.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? 'Hide' : 'Show';
    });

    // Auto-fetch/check when inputs change
    document.getElementById('gh-repo').addEventListener('change', () => fetchLatestData());
    document.getElementById('gh-path').addEventListener('change', () => fetchLatestData());
    document.getElementById('gh-branch').addEventListener('change', () => fetchLatestData());
    document.getElementById('gas-url').addEventListener('change', () => fetchLatestData());
    document.getElementById('gas-token').addEventListener('change', () => fetchLatestData());

    document.getElementById('sync-provider').addEventListener('change', (e) => {
      const provider = e.target.value;
      updateProviderSettingsVisibility(provider);
      try {
        localStorage.setItem('copyflow-sync-provider', provider);
      } catch (ex) {}
      fetchLatestData();
    });

    // Connect & Fetch Latest button
    document.getElementById('btn-refresh').addEventListener('click', () => {
      fetchLatestData(true);
    });

    // Search Filtering
    document.getElementById('search-input').addEventListener('input', () => {
      renderKeysExplorer();
    });

    // Sync Now banner action
    document.getElementById('btn-sync-now').addEventListener('click', () => {
      performSync(true);
    });

    // Deselect All button action
    document.getElementById('btn-deselect-all').addEventListener('click', () => {
      selectedKeys.clear();
      updateSelectionControls();
      renderKeysExplorer();
    });

    // Logging helper
    function log(message, level = 'info') {
      const consoleEl = document.getElementById('console');
      const line = document.createElement('div');
      line.className = `log-line log-${level}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // Render Key Explorer List showing matching version names or Unmatched alerts
    function renderKeysExplorer() {
      const container = document.getElementById('keys-list');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      
      if (availableKeys.length === 0) {
        const provider = document.getElementById('sync-provider').value;
        const providerName = provider === 'github' ? 'GitHub' : 'Google Sheets';
        container.innerHTML = `<div style="padding: 12px; text-align: center; color: var(--text-secondary);">No keys available. Connect to ${providerName}.</div>`;
        return;
      }

      const filtered = availableKeys.filter(k => k.toLowerCase().includes(query));
      
      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 12px; text-align: center; color: var(--text-secondary);">No matching keys found.</div>`;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(key => {
        const item = document.createElement('div');
        item.className = 'key-item';
        
        const isChecked = selectedKeys.has(key);
        const currentText = boundKeysMap[key]; // string value if matched, undefined if not present in Figma
        
        let statusHtml = '';
        if (currentText !== undefined) {
          // Present in Figma - find matching version column name
          let matchingVersion = '';
          const versions = (cachedCopyData[key] && cachedCopyData[key].versions) ? cachedCopyData[key].versions : {};
          for (const vName in versions) {
            if (versions[vName] === currentText) {
              matchingVersion = vName;
              break;
            }
          }
          if (!matchingVersion) {
            matchingVersion = "Custom/Out of Sync";
          }
          statusHtml = `<span class="key-status bound" style="font-size:10px;">${escapeHtml(matchingVersion)}</span>`;
        } else {
          // Not matched in Figma
          statusHtml = `<span class="key-status unbound" style="font-size:10px;">⚠️ Unmatched</span>`;
        }

        // Show a little link/match button next to the status badge ONLY if a canvas text layer is selected and is unmatched to this key
        let matchBtnHtml = '';
        if (selectedNodeId && selectedNodeName !== key) {
          matchBtnHtml = `
            <button class="btn-secondary link-key-btn" data-key="${escapeHtml(key)}" style="width: auto; padding: 2px 6px; font-size: 10px; height: 20px; line-height: 1; border-color: var(--primary); color: var(--primary); margin-right: 8px;">
              Link
            </button>
          `;
        }

        item.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px; flex-grow: 1; overflow: hidden;">
            <input type="checkbox" class="key-checkbox" data-key="${escapeHtml(key)}" ${isChecked ? 'checked' : ''} style="width: auto; margin-bottom: 0; cursor: pointer;">
            <div class="key-name" title="${escapeHtml(key)}">${escapeHtml(key)}</div>
          </div>
          <div style="display: flex; align-items: center;">
            ${matchBtnHtml}
            ${statusHtml}
          </div>
        `;
        
        // Clicking list row (except checkbox and link button) toggles checkbox selection
        item.addEventListener('click', (e) => {
          if (e.target.type === 'checkbox' || e.target.classList.contains('link-key-btn')) return;
          const cb = item.querySelector('.key-checkbox');
          cb.checked = !cb.checked;
          toggleKeyChecked(key, cb.checked);
        });

        // Checkbox click listener
        const checkbox = item.querySelector('.key-checkbox');
        checkbox.addEventListener('change', (e) => {
          toggleKeyChecked(key, e.target.checked);
        });

        // Link button click listener
        if (selectedNodeId && selectedNodeName !== key) {
          const linkBtn = item.querySelector('.link-key-btn');
          linkBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            parent.postMessage({ pluginMessage: { type: 'bind-key', key: key } }, '*');
          });
        }
        
        container.appendChild(item);
      });
    }

    // Helper to toggle checkbox values
    function toggleKeyChecked(key, isChecked) {
      if (isChecked) {
        selectedKeys.add(key);
      } else {
        selectedKeys.delete(key);
      }
      updateSelectionControls();
    }

    // Update selection count text and sync selected button status
    function updateSelectionControls() {
      const countLabel = document.getElementById('checked-count');
      const deselectBtn = document.getElementById('btn-deselect-all');
      const syncSelectedBtn = document.getElementById('btn-sync-selected');

      const count = selectedKeys.size;
      countLabel.textContent = `${count} key${count === 1 ? '' : 's'} selected`;

      if (count > 0) {
        deselectBtn.style.display = 'inline-block';
        syncSelectedBtn.removeAttribute('disabled');
      } else {
        deselectBtn.style.display = 'none';
        syncSelectedBtn.setAttribute('disabled', 'true');
      }
    }

    // Update dynamic version options in dropdown select without losing selection
    function updateVersionSelect(parsedCopyData) {
      const select = document.getElementById('version-select');
      const previousValue = select.value;

      select.innerHTML = '';
      
      const keys = Object.keys(parsedCopyData);
      if (keys.length === 0) {
        select.innerHTML = '<option value="">No versions loaded</option>';
        return;
      }
      
      const versions = Object.keys(parsedCopyData[keys[0]].versions);
      if (versions.length === 0) {
        select.innerHTML = '<option value="">No version columns</option>';
        return;
      }

      versions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });

      // Re-assign previous selected version if it is still present in newly loaded data
      if (previousValue && versions.includes(previousValue)) {
        select.value = previousValue;
      }
    }

    // Robust RFC 4180 CSV parser
    function parseCsv(csvText) {
      const result = {};
      const rows = [];
      let currentField = '';
      let inQuotes = false;
      let currentRow = [];

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (inQuotes) {
          if (char === '"') {
            if (nextChar === '"') {
              currentField += '"';
              i++; // skip next quote
            } else {
              inQuotes = false;
            }
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' || char === '\n') {
            currentRow.push(currentField.trim());
            currentField = '';
            if (currentRow.length > 0 && currentRow.some(f => f !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
            if (char === '\r' && nextChar === '\n') {
              i++;
            }
          } else {
            currentField += char;
          }
        }
      }
      
      if (currentField || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      if (rows.length <= 1) return result;
      
      const headers = rows[0].map(h => h.toLowerCase().trim());
      const keyIdx = headers.indexOf('key');
      const limitIdx = headers.indexOf('character limit');

      // Identify dynamic version headers (columns starting with "copy v" like "Copy V1", "Copy V2")
      const versionHeaders = [];
      headers.forEach((h, idx) => {
        if (/^copy\s+v/i.test(h)) {
          versionHeaders.push({ name: rows[0][idx], index: idx });
        }
      });

      if (keyIdx === -1) {
        log("CSV is missing a 'Key' column header.", "warning");
        return result;
      }

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const key = row[keyIdx];
        if (!key) continue;

        const limit = limitIdx !== -1 && row[limitIdx] ? row[limitIdx] : "";
        
        // Map dynamic version headers to this key
        const versions = {};
        versionHeaders.forEach(vh => {
          versions[vh.name] = row[vh.index] || "";
        });

        result[key] = {
          characterLimit: limit,
          versions: versions
        };
      }
      return result;
    }

    // Helper to calculate a simple hash for change detection
    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = (hash << 5) - hash + char;
        hash = hash & hash;
      }
      return Math.abs(hash).toString(16);
    }

    async function fetchLatestData(isManual = false) {
      const provider = document.getElementById('sync-provider').value;
      if (provider === 'github') {
        await fetchLatestGithub(isManual);
      } else {
        await fetchLatestGoogleSheets(isManual);
      }
    }

    async function fetchLatestGithub(isManual = false) {
      const repo = document.getElementById('gh-repo').value.trim();
      const filePath = document.getElementById('gh-path').value.trim();
      const branch = document.getElementById('gh-branch').value.trim() || 'main';
      const token = document.getElementById('gh-token').value.trim();

      if (!repo || !filePath) {
        if (isManual) log("Please enter GitHub Repository (owner/repo) and CSV File Path.", "warning");
        return;
      }

      // Save credentials locally
      try {
        localStorage.setItem('copyflow-gh-repo', repo);
        localStorage.setItem('copyflow-gh-path', filePath);
        localStorage.setItem('copyflow-gh-branch', branch);
        localStorage.setItem('copyflow-gh-token', token);
      } catch (e) {}

      const url = `https://api.github.com/repos/${repo}/commits?path=${encodeURIComponent(filePath)}&sha=${encodeURIComponent(branch)}&per_page=1`;
      const headers = {
        'Accept': 'application/vnd.github.v3+json'
      };
      if (token) {
        headers['Authorization'] = `token ${token}`;
      }

      if (isManual) log("Checking GitHub for updates...", "info");

      try {
        const res = await fetch(url, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const commits = await res.json();
        if (commits.length === 0) {
          log(`No commits found for file "${filePath}" on branch "${branch}".`, 'warning');
          return;
        }

        const latestCommit = commits[0];
        latestCommitSha = latestCommit.sha;
        const commitMsg = latestCommit.commit.message;
        const author = latestCommit.commit.author.name;
        const commitDate = new Date(latestCommit.commit.author.date).toLocaleString();

        // Download CSV file to parse keys & update dynamic versions select
        cachedCopyData = await downloadCopyFile(repo, filePath, branch, token);
        availableKeys = Object.keys(cachedCopyData);
        
        updateVersionSelect(cachedCopyData);
        renderKeysExplorer();

        // Compare commit SHA with currently synced doc SHA
        const banner = document.getElementById('update-alert-banner');
        document.getElementById('alert-banner-title').textContent = '🆕 New copy version on GitHub!';
        if (latestCommitSha !== documentSha) {
          document.getElementById('alert-commit-msg').textContent = `"${commitMsg}"`;
          document.getElementById('alert-commit-meta').textContent = `By ${author} on ${commitDate}`;
          banner.style.display = 'block';
          if (isManual) log(`New copy version found: ${latestCommitSha.substring(0, 7)}`, 'info');
        } else {
          banner.style.display = 'none';
          if (isManual) log(`Figma is already up-to-date with latest commit: ${latestCommitSha.substring(0, 7)}`, 'success');
        }
      } catch (err) {
        log(`GitHub Check Failed: ${err.message}`, 'warning');
      }
    }

    async function fetchLatestGoogleSheets(isManual = false) {
      const url = document.getElementById('gas-url').value.trim();
      const token = document.getElementById('gas-token').value.trim();

      if (!url) {
        if (isManual) log("Please enter the Web App URL.", "warning");
        return;
      }

      // Save credentials locally
      try {
        localStorage.setItem('copyflow-gas-url', url);
        localStorage.setItem('copyflow-gas-token', token);
      } catch (e) {}

      if (isManual) log("Fetching from Google Sheets...", "info");

      try {
        // Construct URL with token
        const fetchUrl = token ? `${url}?token=${encodeURIComponent(token)}` : url;
        
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        
        if (data.error) {
          throw new Error(data.error);
        }

        cachedCopyData = data;
        availableKeys = Object.keys(cachedCopyData);
        
        updateVersionSelect(cachedCopyData);
        renderKeysExplorer();

        // Generate a pseudo-SHA from the data content
        latestCommitSha = simpleHash(JSON.stringify(data));

        // Compare pseudo-SHA with currently synced doc SHA
        const banner = document.getElementById('update-alert-banner');
        document.getElementById('alert-banner-title').textContent = '🆕 New copy version in Google Sheets!';
        if (latestCommitSha !== documentSha) {
          document.getElementById('alert-commit-msg').textContent = "Google Sheet content changed";
          document.getElementById('alert-commit-meta').textContent = `Detected at ${new Date().toLocaleTimeString()}`;
          banner.style.display = 'block';
          if (isManual) log(`New copy version detected (Hash: ${latestCommitSha.substring(0, 7)})`, 'info');
        } else {
          banner.style.display = 'none';
          if (isManual) log(`Figma is already up-to-date with Google Sheet (Hash: ${latestCommitSha.substring(0, 7)})`, 'success');
        }
      } catch (err) {
        log(`Google Sheets Fetch Failed: ${err.message}`, 'warning');
      }
    }

    // Helper to download raw CSV from GitHub (supports public & private repos)
    async function downloadCopyFile(repo, filePath, branch, token) {
      let url;
      const headers = {};

      if (token) {
        // Private repo raw Contents API fetch
        url = `https://api.github.com/repos/${repo}/contents/${filePath}?ref=${branch}`;
        headers['Authorization'] = `token ${token}`;
        headers['Accept'] = 'application/vnd.github.v3.raw';
      } else {
        // Public raw content fetch
        url = `https://raw.githubusercontent.com/${repo}/${branch}/${filePath}?_t=${Date.now()}`;
      }

      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error(`Failed to download file: HTTP ${res.status}`);
      const csvText = await res.text();
      return parseCsv(csvText);
    }

    // Trigger standard sync flow (syncAll specifies Sync All vs Sync Selected Node)
    async function performSync(syncAll = true) {
      const selectedVersion = document.getElementById('version-select').value;
      if (!selectedVersion) {
        log("No version selected or available to sync.", "warning");
        return;
      }

      log(`Syncing version "${selectedVersion}" to layers...`, "info");
      
      parent.postMessage({
        pluginMessage: {
          type: 'sync-layers',
          copyData: cachedCopyData,
          stage: selectedVersion,
          sha: latestCommitSha,
          syncAll: syncAll,
          selectedKeys: Array.from(selectedKeys)
        }
      }, '*');
    }

    // Sync button triggers
    document.getElementById('btn-sync').addEventListener('click', () => {
      performSync(true);
    });

    document.getElementById('btn-sync-selected').addEventListener('click', () => {
      performSync(false);
    });

    // Message handler from Figma main thread
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'selection-changed') {
        const selectedLayerName = document.getElementById('selected-layer-name');
        const selectedLayerMatchBadge = document.getElementById('selected-layer-match-badge');
        const selectionStatusBar = document.getElementById('selection-status-bar');

        boundKeysMap = msg.boundKeysMap || {};
        documentSha = msg.lastSyncedSha || "";
        
        renderKeysExplorer();

        // Refresh banner display based on new documentSha
        const banner = document.getElementById('update-alert-banner');
        if (latestCommitSha && latestCommitSha !== documentSha) {
          banner.style.display = 'block';
        } else {
          banner.style.display = 'none';
        }

        if (msg.selected) {
          selectedNodeId = msg.nodeId;
          selectedNodeName = msg.nodeName;
          selectedLayerName.textContent = msg.nodeName;
          selectionStatusBar.style.display = "flex";
          
          // Check if selected layer's name matches a key from the spreadsheet
          const hasMatch = availableKeys.includes(msg.nodeName);
          if (hasMatch) {
            selectedLayerMatchBadge.textContent = "Matched";
            selectedLayerMatchBadge.className = "key-status bound";
            selectedLayerMatchBadge.style.display = "inline-flex";
          } else {
            selectedLayerMatchBadge.textContent = "Unmatched";
            selectedLayerMatchBadge.className = "key-status unbound";
            selectedLayerMatchBadge.style.display = "inline-flex";
          }
        } else {
          selectedNodeId = null;
          selectedNodeName = "";
          selectedLayerName.textContent = "None";
          selectedLayerMatchBadge.style.display = "none";
          selectionStatusBar.style.display = "none";
        }
        
        // Refresh explorer view to show link/match button if selection status has changed
        renderKeysExplorer();
      }

      if (msg.type === 'log') {
        log(msg.message, msg.level);
      }

      if (msg.type === 'sync-complete') {
        log(`Sync finished. Updated ${msg.updatedCount} layers. Warnings: ${msg.overflowCount}`, 'success');
        fetchLatestData();
      }
    };

    // Helper to escape html characters safely
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
